name: release

on:
  push:
    branches: [main]      # 推 main 也构建一次，方便验证 CI 是否正常
    tags: ["v*"]          # 打 tag 时额外附到 Release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 附到 Release 需要写权限；GitHub 新仓库默认只读，必须显式声明
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Windows 上提交的 gradlew 不带可执行位，这里补一次（否则 Permission denied）
      - name: 修正 gradlew 权限
        run: chmod +x ./gradlew

      # GitHub 的 ubuntu runner 已预装 Android SDK，直接用它的 sdkmanager 补齐缺的组件
      # （不要用第三方 setup-android action：它会与预装环境冲突）
      - name: 补齐 Android SDK 组件（android-36 / build-tools 35、36）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" || true
          sdkmanager "build-tools;35.0.0" || true
          sdkmanager "build-tools;36.0.0" || true
          sdkmanager --list_installed | head -20

      - name: 核心单测（214 项）
        run: ./gradlew :domain:test --console=plain

      - name: 构建正式包（使用仓库公开的 signing/ 密钥签名）
        run: ./gradlew :app:assembleRelease --console=plain

      # 校验只是"体检"：失败也不该拦住发布（用 continue-on-error）
      # 先定位真实产物再规范到固定路径：AGP 在不同环境下的输出名可能不同
      - name: 定位并规范产物（含诊断）
        run: |
          mkdir -p dist
          {
            echo "## 自动构建产物信息"
            echo ""
            echo "运行的提交: $GITHUB_SHA"
            echo ""
            echo "在 app/build/outputs 下找到的 APK："
            echo '```'
            find app/build/outputs -name "*.apk" -printf "%p  %s bytes\n" || true
            echo '```'
          } > dist/notes.md
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "没找到任何 APK 文件" | tee -a dist/notes.md
            exit 1
          fi
          cp "$APK" dist/tavern-release.apk
          {
            echo ""
            echo "已规范为: dist/tavern-release.apk"
            echo '```'
            ls -l dist/
            sha256sum dist/tavern-release.apk
            echo '```'
            echo ""
            echo "> 本项目**公开签名密钥**（见 \`signing/\`），任何人都可以构建可覆盖安装的包。请只从你信任的来源安装。"
          } >> dist/notes.md
          cat dist/notes.md

      - name: 校验签名与版本号
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          sh "$SDK/build-tools/$BT/apksigner" verify --print-certs dist/tavern-release.apk || true
          sh "$SDK/build-tools/$BT/aapt" dump badging dist/tavern-release.apk | head -1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavern-release-apk
          path: dist/tavern-release.apk
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tavern-release.apk
          fail_on_unmatched_files: true
          body_path: dist/notes.md
          name: 酒馆 ${{ github.ref_name }}
